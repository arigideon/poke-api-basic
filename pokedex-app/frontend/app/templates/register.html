{% extends "base.html" %}
{% block title %}Register — Pokédex{% endblock %}

{% block content %}
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="28" fill="#CC0000"/>
        <rect x="0" y="24" width="56" height="8" fill="#111"/>
        <circle cx="28" cy="28" r="10" fill="#111"/>
        <circle cx="28" cy="28" r="6" fill="white"/>
        <circle cx="28" cy="28" r="3" fill="#CC0000"/>
      </svg>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the Pokédex community</p>
    </div>

    <div id="error-msg" class="alert alert-error" style="display:none"></div>
    <div id="success-msg" class="alert alert-success" style="display:none"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="your_username" required minlength="3" maxlength="50" />
        <span class="form-hint">3–50 characters, letters, numbers, - and _ only</span>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="••••••••" required minlength="8" />
        <span class="form-hint">Minimum 8 characters</span>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">
        <span id="btn-text">Create Account</span>
        <span id="btn-spinner" class="btn-spinner" style="display:none"></span>
      </button>
    </form>

    <p class="auth-link">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('register-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const btnSpinner = document.getElementById('btn-spinner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    submitBtn.disabled = true;
    btnText.textContent = 'Creating account…';
    btnSpinner.style.display = 'inline-block';

    try {
      const resp = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value.trim(),
          email: form.email.value.trim(),
          password: form.password.value,
        }),
      });

      const data = await resp.json();

      if (resp.status === 201) {
        successMsg.textContent = 'Account created! Redirecting to login…';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = '/login'; }, 1500);
      } else {
        const detail = Array.isArray(data.detail)
          ? data.detail.map(d => d.msg).join(' — ')
          : (data.detail || 'Registration failed.');
        errorMsg.textContent = detail;
        errorMsg.style.display = 'block';
      }
    } catch {
      errorMsg.textContent = 'Connection error. Please try again.';
      errorMsg.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      btnText.textContent = 'Create Account';
      btnSpinner.style.display = 'none';
    }
  });
</script>
{% endblock %}
