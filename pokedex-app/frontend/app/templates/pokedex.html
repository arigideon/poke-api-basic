{% extends "base.html" %}
{% block title %}Pokédex{% endblock %}

{% block content %}
<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-logo">
    <svg width="36" height="36" viewBox="0 0 56 56" fill="none">
      <circle cx="28" cy="28" r="28" fill="white" fill-opacity="0.15"/>
      <rect x="0" y="24" width="56" height="8" fill="#111" fill-opacity="0.4"/>
      <circle cx="28" cy="28" r="10" fill="#111" fill-opacity="0.4"/>
      <circle cx="28" cy="28" r="6" fill="white" fill-opacity="0.8"/>
      <circle cx="28" cy="28" r="3" fill="#CC0000"/>
    </svg>
    <span class="header-title">Pokédex</span>
  </div>
  <div class="header-user">
    <span class="header-username">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      {{ user.username }}
    </span>
    <a href="/logout" class="btn-logout">Logout</a>
  </div>
</header>

<!-- ===== CONTROLS ===== -->
<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" class="search-input" type="search"
           placeholder="Search by name or #ID…" autocomplete="off" />
  </div>
  <div id="type-filters" class="type-filters"></div>
</div>

<!-- ===== GRID ===== -->
<main id="pokemon-grid" class="pokemon-grid" aria-label="Pokémon list"></main>

<!-- ===== PAGINATION ===== -->
<div class="pagination" id="pagination">
  <button id="prev-btn" class="page-btn" disabled>&#8592; Prev</button>
  <span id="page-info" class="page-info"></span>
  <button id="next-btn" class="page-btn">Next &#8594;</button>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Pokémon detail">
  <div class="modal" id="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast" role="alert" aria-live="polite"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
