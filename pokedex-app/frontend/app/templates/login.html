{% extends "base.html" %}
{% block title %}Login — Pokédex{% endblock %}

{% block content %}
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="28" fill="#CC0000"/>
        <rect x="0" y="24" width="56" height="8" fill="#111"/>
        <circle cx="28" cy="28" r="10" fill="#111"/>
        <circle cx="28" cy="28" r="6" fill="white"/>
        <circle cx="28" cy="28" r="3" fill="#CC0000"/>
      </svg>
      <h1 class="auth-title">Pokédex</h1>
      <p class="auth-subtitle">Sign in to access your Pokédex</p>
    </div>

    <div id="error-msg" class="alert alert-error" style="display:none"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="your_username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">
        <span id="btn-text">Sign In</span>
        <span id="btn-spinner" class="btn-spinner" style="display:none"></span>
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a href="/register">Create one</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const btnSpinner = document.getElementById('btn-spinner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    btnText.textContent = 'Signing in…';
    btnSpinner.style.display = 'inline-block';

    try {
      const resp = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value.trim(),
          password: form.password.value,
        }),
      });

      if (resp.ok) {
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/';
      } else {
        const data = await resp.json();
        errorMsg.textContent = data.detail || 'Invalid credentials. Please try again.';
        errorMsg.style.display = 'block';
      }
    } catch {
      errorMsg.textContent = 'Connection error. Please try again.';
      errorMsg.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      btnText.textContent = 'Sign In';
      btnSpinner.style.display = 'none';
    }
  });
</script>
{% endblock %}
