version: "3.9"

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - auth-service
      - backend
    networks:
      - pokedex-net
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - DATABASE_URL=sqlite:////app/data/auth.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - auth-db:/app/data
    networks:
      - pokedex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build: ./backend
    environment:
      - POKEAPI_BASE_URL=https://pokeapi.co/api/v2
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    networks:
      - pokedex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - BACKEND_URL=http://backend:8000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
    networks:
      - pokedex-net
    restart: unless-stopped
    depends_on:
      - auth-service
      - backend

networks:
  pokedex-net:
    driver: bridge

volumes:
  auth-db:
